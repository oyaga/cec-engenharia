server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Cabeçalhos de segurança (corrige achado M2/rede: HSTS/CSP/etc ausentes) ───
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: ajustar 'connect-src' para a URL real da API em produção.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # HTML principal: Sempre revalidar para garantir que o usuário veja novas versões do app
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets estáticos com hashes no nome (JS, CSS) e fontes: Cache de 1 ano (imutável)
    location ~* \.(?:js|css|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imagens e mídias gerais: Cache de 30 dias
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
    }
}
