# Stack UNIFICADO do CEC para o PORTAINER — UMA imagem (app) + banco.
# O serviço `app` (imagem oyaga/cec) serve a API + WebSocket + o site (SPA).
# Não há nginx nem serviço web separado.
#
# Portainer: Stacks → Add stack → cole este YAML → preencha as variáveis de
# ambiente (senha do banco, JWT, domínio) → Deploy.
# Imagem esperada no Docker Hub: ${DOCKER_USER}/cec:${TAG}  (padrão oyaga/cec:latest)

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cec}
    volumes:
      - cec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cec} -d ${POSTGRES_DB:-cec}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    image: ${DOCKER_USER:-oyaga}/cec:${TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      # Mesma origem (o app serve o site), então CORS é opcional.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: "postgres://${POSTGRES_USER:-cec}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-cec}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?gere com openssl rand -base64 48}"
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      SEED_DEV: "${SEED_DEV:-false}"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STORAGE_DIR: "/app/uploads"
      PUBLIC_URL: "${PUBLIC_URL:?defina o dominio publico}"
      ASAAS_ENV: ${ASAAS_ENV:-production}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      MARIA_ATTENDANT: ${MARIA_ATTENDANT:-}
    volumes:
      - cec_uploads:/app/uploads
    ports:
      - "${WEB_PORT:-80}:8080"
      # TLS: recomendado um proxy (Caddy/Traefik/Nginx Proxy Manager) à frente.

volumes:
  cec_pgdata:
  cec_uploads:
