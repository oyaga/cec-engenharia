# Nginx para análise LOCAL: serve o SPA e faz proxy same-origin para a API Go,
# evitando CORS/CSP. Não use em produção (use nginx.conf + API separada).

# Suporte a WebSocket (chat interno em tempo real): Connection: upgrade quando há Upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (mesma postura da produção, CSP ajustada p/ same-origin).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'" always;

    # Proxy da API (mesma origem do browser → sem CORS). Suporta WebSocket.
    # ^~ impede que as regras regex de mídia (.mp4/.pdf) interceptem arquivos
    # servidos pelo backend em /api/v1/files/.
    location ^~ /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 25m;
    }

    # SPA (React Router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:js|css|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
    }
}
